---
- name: Install Vim, Zsh, and Tmux packages
  community.general.homebrew:
    name:
      - neovim
      - zsh
      - tmux
    state: present

- name: Create symlinks for dotfiles
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    state: link
    force: yes
  loop:
    # - { src: 'myconf/dotfiles/vim/vimrc-mini.vim', dest: '.vimrc' }
    # - { src: 'myconf/dotfiles/vim', dest: '.config/nvim' }
    - { src: 'myconf/dotfiles/zsh/zshrc-mac.zsh', dest: '.zshrc' }
    - { src: 'myconf/dotfiles/tmux/tmux.conf', dest: '.tmux.conf' }
    - { src: 'myconf/ssh', dest: '.ssh' }
    - { src: 'myconf/config', dest: '.config' }
    - { src: 'myconf/dotfiles/etc/tigrc', dest: '.tigrc' }
    - { src: 'myconf/config/claude/settings.json', dest: '.claude/settings.json' }
    - { src: 'myconf/config/claude/CLAUDE.md', dest: '.claude/CLAUDE.md' }

- name: Touch files
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: touch
    mode: '0644'
  loop:
    - ".vimrc-env.vim"
    - ".vimrc-local.vim"
    - ".global.env"

- name: Copy files
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'myconf/dotfiles/etc/git/gitconfig-init.ini', dest: '.gitconfig' }
