---
- name: Install Vim, Zsh, and Tmux packages
  community.general.homebrew:
    name:
      - neovim
      - zsh
      - tmux
    state: present

- name: Ensure clangd user-config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/Library/Preferences/clangd"
    state: directory
    mode: '0755'

- name: Create symlinks for dotfiles
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    state: link
    force: yes
  loop:
    # - { src: 'myconf/dotfiles/vim/vimrc-mini.vim', dest: '.vimrc' }
    # - { src: 'myconf/dotfiles/vim', dest: '.config/nvim' }
    - { src: 'myconf/dotfiles/zsh/zshrc-mac.zsh', dest: '.zshrc' }
    - { src: 'myconf/dotfiles/tmux/tmux.conf', dest: '.tmux.conf' }
    - { src: 'myconf/ssh', dest: '.ssh' }
    - { src: 'myconf/config', dest: '.config' }
    - { src: 'myconf/dotfiles/etc/tigrc', dest: '.tigrc' }
    - { src: 'myconf/dotfiles/ai/claude', dest: 'myconf/config/claude' }
    - { src: 'myconf/dotfiles/ai/claude/CLAUDE.md', dest: '.claude/CLAUDE.md' }
    - { src: 'myconf/dotfiles/ai/claude/settings.json', dest: '.claude/settings.json' }
    - { src: 'myconf/dotfiles/ai/claude/skills', dest: '.claude/skills' }
    - { src: 'myconf/dotfiles/ai/openai', dest: 'myconf/config/openai' }
    - { src: 'myconf/dotfiles/ai/openai/AGENTS.md', dest: '.codex/AGENTS.md' }
    - { src: 'myconf/dotfiles/etc/fd', dest: 'myconf/config/fd' }
    - { src: 'myconf/dotfiles/os/macos/clangd-config.yaml', dest: 'Library/Preferences/clangd/config.yaml' }
    # config.toml is NOT symlinked/tracked: it's too sensitive for git, kept as a
    # plain file at ~/.codex/config.toml managed outside this repo.

- name: Link Codex user skills without replacing system-managed skills
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/myconf/dotfiles/ai/openai/skills/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.codex/skills/{{ item }}"
    state: link
    force: yes
  loop:
    - ansible
    - grillme
    - terraform

- name: Touch files
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: touch
    mode: '0644'
  loop:
    - ".vimrc-env.vim"
    - ".vimrc-local.vim"
    - ".global.env"

- name: Copy files
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'myconf/dotfiles/etc/git/gitconfig-init.ini', dest: '.gitconfig' }
