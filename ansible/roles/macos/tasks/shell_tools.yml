---
- name: Install Vim, Zsh, Tmux, and Pandoc packages
  community.general.homebrew:
    name:
      - zsh
      - tmux
      - pandoc  # markdown -> HTML preview (see vimrc-functions.vim PreviewMarkdown)
    state: present
  # Neovim itself is installed by neovim.yml (GitHub release, not Homebrew).

- name: Link shared CLI configs (tig, fd, pylint, git)
  ansible.builtin.command: "{{ playbook_dir }}/../install.sh"
  register: etc_install
  changed_when: "'linked' in etc_install.stdout"

- name: Touch files
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: touch
    mode: '0644'
  loop:
    - ".vimrc-env.vim"
    - ".vimrc-local.vim"
    - ".global.env"
