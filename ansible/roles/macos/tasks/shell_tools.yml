---
- name: Install Vim, Zsh, Tmux, and Pandoc packages
  community.general.homebrew:
    name:
      - zsh
      - tmux
      - pandoc  # markdown -> HTML preview (see vimrc-functions.vim PreviewMarkdown)
    state: present
  # Neovim itself is installed by neovim.yml (GitHub release, not Homebrew).

- name: Ensure target config and tool directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - myconf/config
    - .claude
    - .codex/skills
    - .gemini/skills
    - .gemini/config
    - .antigravity

- name: Create symlinks for dotfiles
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    state: link
    force: yes
  loop:
    # - { src: 'myconf/dotfiles/vim', dest: '.config/nvim' }
    - { src: 'myconf/dotfiles/zsh/zshrc-mac.zsh', dest: '.zshrc' }
    - { src: 'myconf/dotfiles/tmux/tmux.conf', dest: '.tmux.conf' }
    - { src: 'myconf/ssh', dest: '.ssh' }
    - { src: 'myconf/config', dest: '.config' }
    - { src: 'myconf/dotfiles/etc/tigrc', dest: '.tigrc' }
    - { src: 'myconf/dotfiles/llm/claude', dest: 'myconf/config/claude' }
    - { src: 'myconf/dotfiles/llm/claude/CLAUDE.md', dest: '.claude/CLAUDE.md' }
    - { src: 'myconf/dotfiles/llm/claude/settings.json', dest: '.claude/settings.json' }
    - { src: 'myconf/dotfiles/llm/claude/skills', dest: '.claude/skills' }
    - { src: 'myconf/dotfiles/llm/openai', dest: 'myconf/config/openai' }
    - { src: 'myconf/dotfiles/llm/openai/AGENTS.md', dest: '.codex/AGENTS.md' }
    - { src: 'myconf/dotfiles/llm/antigravity', dest: 'myconf/config/antigravity' }
    - { src: 'myconf/dotfiles/llm/antigravity/settings.json', dest: '.gemini/settings.json' }
    - { src: 'myconf/dotfiles/llm/antigravity/GEMINI.md', dest: '.gemini/GEMINI.md' }
    - { src: 'myconf/dotfiles/llm/antigravity/GEMINI.md', dest: '.gemini/config/GEMINI.md' }
    - { src: 'myconf/dotfiles/llm/antigravity/GEMINI.md', dest: '.gemini/AGENTS.md' }
    - { src: 'myconf/dotfiles/llm/antigravity/GEMINI.md', dest: '.antigravity/GEMINI.md' }
    - { src: 'myconf/dotfiles/llm/antigravity/GEMINI.md', dest: '.antigravity/AGENTS.md' }
    - { src: 'myconf/dotfiles/etc/fd', dest: 'myconf/config/fd' }

    # config.toml is NOT symlinked/tracked: it's too sensitive for git, kept as a
    # plain file at ~/.codex/config.toml managed outside this repo.

- name: Link Codex user skills without replacing system-managed skills
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/myconf/dotfiles/llm/claude/skills/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.codex/skills/{{ item }}"
    state: link
    force: yes
  loop: "{{ llm_skills }}"

- name: Link Antigravity user skills without replacing system-managed skills
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/myconf/dotfiles/llm/claude/skills/{{ item }}"
    dest: "{{ ansible_facts.env.HOME }}/.gemini/skills/{{ item }}"
    state: link
    force: yes
  loop: "{{ llm_skills }}"



- name: Touch files
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: touch
    mode: '0644'
  loop:
    - ".vimrc-env.vim"
    - ".vimrc-local.vim"
    - ".global.env"

- name: Copy files
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'myconf/dotfiles/etc/git/gitconfig-init.ini', dest: '.gitconfig' }
