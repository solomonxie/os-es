---
- name: Install Vim, Zsh, Tmux, and Pandoc packages
  community.general.homebrew:
    name:
      - zsh
      - tmux
      - pandoc  # markdown -> HTML preview (see vimrc-functions.vim PreviewMarkdown)
    state: present
  # Neovim itself is installed by neovim.yml (GitHub release, not Homebrew).

- name: Ensure target config and tool directories exist
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: directory
    mode: '0755'
  loop:
    - myconf/config

- name: Create symlinks for dotfiles
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    state: link
    force: yes
  loop:
    - { src: 'myconf/ssh', dest: '.ssh' }
    - { src: 'myconf/config', dest: '.config' }
    - { src: 'myconf/os-es/etc/tigrc', dest: '.tigrc' }
    - { src: 'myconf/os-es/etc/fd', dest: 'myconf/config/fd' }
    - { src: 'myconf/os-es/etc/git', dest: 'myconf/config/git' }
    - { src: 'myconf/os-es/etc/pylintrc', dest: 'myconf/config/pylintrc' }

- name: Touch files
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: touch
    mode: '0644'
  loop:
    - ".vimrc-env.vim"
    - ".vimrc-local.vim"
    - ".global.env"

- name: Copy files
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'myconf/os-es/etc/git/gitconfig-init.ini', dest: '.gitconfig' }
