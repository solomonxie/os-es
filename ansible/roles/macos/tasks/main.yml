# Tasks to install Homebrew dependencies, manage packages, and configure macOS system settings.
---
- name: Ensure Homebrew taps are present
  community.general.homebrew_tap:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_taps }}"

- name: Install Homebrew formulas
  community.general.homebrew:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_packages }}"
- name: Install Homebrew cask applications
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
  loop: "{{ homebrew_cask_packages }}"

- name: Install Mac App Store applications
  community.general.mas:
    id: "{{ item.id }}"
    state: present
  loop: "{{ mas_apps }}"


- name: Create symlinks for dotfiles
  ansible.builtin.file:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    state: link
    force: yes
  loop:
    - { src: 'myconf/config', dest: '.config' }
    - { src: 'myconf/ssh', dest: '.ssh' }
    - { src: 'myconf/dotfiles/etc/tigrc', dest: '.tigrc' }
    - { src: 'myconf/dotfiles/tmux/tmux.conf', dest: '.tmux.conf' }
    - { src: 'myconf/dotfiles/zsh/zshrc-mac.zsh', dest: '.zshrc' }

- name: Touch files
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/{{ item }}"
    state: touch
    mode: '0644'
  loop:
    - ".vimrc-env.vim"
    - ".vimrc-local.vim"
    - ".global.env"

- name: Copy files
  ansible.builtin.copy:
    src: "{{ ansible_facts.env.HOME }}/{{ item.src }}"
    dest: "{{ ansible_facts.env.HOME }}/{{ item.dest }}"
    mode: '0644'
  loop:
    - { src: 'myconf/dotfiles/etc/git/gitconfig-init.ini', dest: '.gitconfig' }

