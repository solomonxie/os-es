---
# ollama itself is installed via homebrew_packages (tasks/main.yml).
# `ollama serve` isn't started here: the CLI auto-launches the local
# server on demand for `pull`/`run` if it isn't already up.

- name: Check which Ollama models are already pulled
  ansible.builtin.command: ollama list
  register: ollama_list
  changed_when: false

- name: Pull default Ollama models
  ansible.builtin.command: "ollama pull {{ item }}"
  loop: "{{ ollama_models }}"
  when: item not in ollama_list.stdout
