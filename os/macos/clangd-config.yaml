# User config for clangd (https://clangd.llvm.org/config.html)
# macOS path: ~/Library/Preferences/clangd/config.yaml
#
# clang's driver won't build a compiler invocation for a .ino extension on
# its own (fails with "expected exactly one compiler job"), which crashes
# clangd's AST for that file. Force C++ mode for it; Arduino sketches are
# already just C++ minus an #include and a couple of implicit declarations.
If:
  PathMatch: .*\.ino
CompileFlags:
  Add: [-xc++]
