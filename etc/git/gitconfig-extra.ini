# This is Git's per-user configuration file.
[core]
    editor = /usr/bin/vi -u NONE -N
	# pager = diff-so-fancy | less --tabs=4 -RFX
    # pager = delta
    hooksPath = ~/myconf/dotfiles/etc/git/hooks
[diff]
	context = 0

;========Git-Delta=========
;https://github.com/dandavison/delta
[delta]
    plus-style = "syntax #012800"
    minus-style = "syntax #340001"
    syntax-theme = Monokai Extended
    navigate = true
    side-by-side = true
    line-numbers-left-format = ""
    line-numbers-right-format = "│ "
[interactive]
    diffFilter = delta --color-only
;========Git-Delta=========

[color]
    ui = true
[credential]
    helper = cache
[commit]
    template = ~/myconf/dotfiles/etc/git/git-commit-template.txt
; [diff]
;     tool = nvimdiff
; Used when executing `git difftool master`
[difftool "nvimdiff"]
    cmd = "nvim -d \"$LOCAL\"  \"$REMOTE\""
[merge]
    tool = nvimdiff

; Used when having conflict and executing `git mergetool`
[mergetool "nvimdiff"]
    cmd = "nvim -d \"$LOCAL\" \"$BASE\" \"$REMOTE\" \"$MERGED\" -c '$wincmd w' -c 'wincmd J' "

[pull]
	rebase = false
[alias]
    # Shortening aliases
    ci = commit
    co = checkout
    br = branch
    up = push
    dn = pull

    # Feature improving aliases
    st = status -sb
    a = add -p
    type = cat-file -t
    dump = cat-file -p

    # Working with branches
    branchname = "!git rev-parse --abbrev-ref HEAD"
    # Push the current branch to the remote
    pub = "!git push origin $(git branchname)"
    pushall = "!git remote | xargs -L1 git push --all"
    sync = "!git pull origin $(git branchname)"
    # Fetch all remote branches
    # fetchall = "!git branch -r | grep -v '\->' | while read remote; do git branch --track \"${remote#origin/}\" \"$remote\"; done"
    # Get the root path of the project
    root = "!git rev-parse --show-toplevel"
    first = "!git rev-list --max-parents=0 HEAD"

    # Remote web links
    remote-name = "!git remote | head -n 1"
    remote-url = "!f() { name=\"$(git remote-name)\"; if [ -z \"$name\" ]; then echo \"No git remote found\" >&2; return 1; fi; git remote get-url \"$name\"; }; f"
    # Remote URL normalized to https, without the .git suffix
    web-url = "!f() { url=\"$(git remote-url)\" || return 1; printf '%s\\n' \"$url\" | sed -E 's#^git@([^:]+):#https://\\1/#; s#^(git\\+)?ssh://git@#https://#; s#\\.git/?$##'; }; f"
    # Current branch, or the short sha when detached
    web-ref = "!git symbolic-ref --short HEAD 2>/dev/null || git rev-parse --short HEAD"
    # Web URL of the current branch, plus the given subpath (default: cwd)
    link = "!f() { url=\"$(git web-url)\" || return 1; case \"$url\" in https://gitlab.com/*) url=\"$url/-/tree\" ;; *) url=\"$url/tree\" ;; esac; path=\"${1:-$GIT_PREFIX}\"; path=\"${path%/}\"; printf '%s\\n' \"$url/$(git web-ref)${path:+/$path}\"; }; f"
    # Open that link in a browser
    open = "!f() { url=\"$(git link \"$GIT_PREFIX\")\" || return 1; if command -v open >/dev/null 2>&1; then open \"$url\"; elif command -v xdg-open >/dev/null 2>&1; then xdg-open \"$url\"; else printf '%s\\n' \"$url\"; fi; }; f"

    # Composite functionalities
    unstage = reset HEAD --
    unset = reset --hard

    # Stats
    last = log -1 HEAD
    rank = shortlog -sn --no-merges
    count = "!git diff --cached --numstat | wc -l"
    dirty = "!git diff master --name-only |cat"
    quickcommit = "!git commit -m \"updated on branch [$(git branchname)]\""
    untracked = "!git ls-files . --exclude-standard --others"
    changedfiles = "!git diff-tree --no-commit-id --name-only -r"

    # UI Improvements
    logs = log --graph --pretty='format:%C(red)%d%C(reset) %C(yellow)%h%C(reset) %ar %C(green)%aN%C(reset) %s'
    logc = log --color --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cr) %C(bold blue)<%an>%Creset' --abbrev-commit
    logp = log --graph --pretty='format:%C(red)%d%C(reset) %C(yellow)%h%C(reset) %ar %C(green)%aN%C(reset) %s'
    logt = log --stat --since='1 Day Ago' --graph --pretty=oneline --abbrev-commit --date=relative
    history = log --follow -p
    commits = log --pretty=oneline

    # !DELETES
    delete-branch = "!git branch --merged | grep -v '*' | xargs -n 1 git branch -d"
    delete-cache = "!git rm --cached --ignore-unmatch"
    delete-cred = "!git filter-branch --force --index-filter 'git rm --cached --ignore-unmatch /path/to/file $(git first)..HEAD'"

    # CHANGE HISTORY
    # change-commits = "!f() { VAR=$1; OLD=$2; NEW=$3; shift 3; git filter-branch --env-filter \"if [[ \\\"$`echo $VAR`\\\" = '$OLD' ]]; then export $VAR='$NEW'; fi\" \$@; }; f"
