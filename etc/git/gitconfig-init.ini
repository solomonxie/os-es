# Template for ~/.gitconfig, the machine-local git config (name, email, credentials).
# install.sh copies it once and never overwrites it; shared settings come from the include below.
#   $ git config --global user.name "YourName"
#   $ git config --global user.email "a@b.com"
[user]
	name = <your-name>
	email = <your-email>
[include]
    path = ~/.config/git/gitconfig-extra.ini
[credential "https://github.com"]
	helper = 
	helper = !/opt/homebrew/bin/gh auth git-credential
[credential "https://gist.github.com"]
	helper = 
	helper = !/opt/homebrew/bin/gh auth git-credential
[init]
	defaultBranch = master
